html,body{margin:0;height:100%;background:#0d0806;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
body.portrait{align-items:flex-start}
canvas{display:block;touch-action:none;outline:none}
button{font-family:inherit;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
#top{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:5}
#top button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(241,230,204,.4);background:rgba(18,11,6,.55);color:#f1e6cc;font-size:14px;line-height:1}
#top button.off{opacity:.4;text-decoration:line-through}
#pad{display:none}
body.touch #pad{display:block}
.grp{position:fixed;bottom:14px;display:flex;gap:12px;align-items:flex-end;z-index:5}
.grp.l{left:14px}.grp.r{right:14px}
#pad button{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(241,230,204,.5);background:rgba(18,11,6,.4);color:#f1e6cc;font-size:22px;line-height:1;touch-action:none}
#pad button.big{width:82px;height:82px;font-size:30px}
#pad button.on{background:rgba(241,230,204,.38)}
body.portrait.touch .grp{bottom:12vh}
body.portrait.touch #pad button{width:76px;height:76px}
body.portrait.touch #pad button.big{width:100px;height:100px}
#rot{display:none}
body.portrait.touch #rot{display:block;position:fixed;left:0;right:0;top:calc(56.25vw + 20px);text-align:center;color:rgba(241,230,204,.5);font-style:italic;font-size:14px}
</style>

<div id="top"><button id="bMute" title="Audio" aria-label="Audio">♪</button><button id="bPause" title="Pausa" aria-label="Pausa">❙❙</button><button id="bFull" title="Schermo intero" aria-label="Schermo intero">⛶</button></div>
<div id="rot">ruota il telefono per leggere più in grande</div>
<div id="pad" aria-hidden="true">
  <div class="grp l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp r"><button data-k="erase">✎</button><button data-k="jump" class="big">▲</button></div>
</div>
<script>
'use strict';
/* ============================================================
   MARGINALIA — core: canvas, utilità, input, audio, particelle
   ============================================================ */
const W = 960, H = 540, TAU = Math.PI * 2;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SCALE = 1;
let IS_TOUCH = false;

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw * 1.05;
  document.body.classList.toggle('portrait', portrait);
  let cw = vw, ch = vw * 9 / 16;
  if (ch > vh) { ch = vh; cw = vh * 16 / 9; }
  cv.style.width = Math.floor(cw) + 'px';
  cv.style.height = Math.floor(ch) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let bw = Math.round(cw * dpr);
  bw = Math.max(960, Math.min(1920, bw));
  cv.width = bw; cv.height = Math.round(bw * 9 / 16);
  SCALE = bw / W;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));

/* ---------- utilità ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const sgn = v => v < 0 ? -1 : 1;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const SERIF = '"EB Garamond", Georgia, "Iowan Old Style", "Palatino Linotype", "Noto Serif", "Times New Roman", serif';
const F_LINE = 'italic 500 24px ' + SERIF;
const F_HAND = 'italic 500 19px ' + SERIF;
const INK = '#17120e', GRAPHITE = '#7d7872', VIOLET = '#3b1c5e', DEEP = '#07040c';

/* ---------- input ---------- */
const keys = {}, kd = {}; // kd: tasti premuti dall'ultimo fotogramma, per non perdere i tocchi brevissimi
const K = c => keys[c] || kd[c];
const touch = { left: false, right: false, jump: false, erase: false };
const inp = { left: false, right: false, jump: false, jumpP: false, erase: false, eraseP: false, startP: false, pauseP: false };
let prevJ = false, prevE = false, prevS = false, prevPz = false;
let uiTap = null; // {x,y} in coordinate logiche, consumato dalla UI

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { keys[e.code] = true; kd[e.code] = true; AU.unlock(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in touch) touch[k] = false; });

cv.addEventListener('pointerdown', e => {
  AU.unlock();
  const r = cv.getBoundingClientRect();
  uiTap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  if (e.pointerType === 'touch') enableTouch();
});
function enableTouch() {
  if (IS_TOUCH) return;
  IS_TOUCH = true; document.body.classList.add('touch');
}
function bindPad() {
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.getAttribute('data-k');
    const on = e => { e.preventDefault(); AU.unlock(); enableTouch(); touch[k] = true; el.classList.add('on'); };
    const off = e => { e.preventDefault(); touch[k] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
}
function pollInput() {
  let gl = false, gr = false, gj = false, ge = false, gs = false;
  try {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const g of pads) {
      if (!g || !g.buttons) continue;
      const ax = g.axes && g.axes[0] || 0, b = i => g.buttons[i] && g.buttons[i].pressed;
      if (ax < -.35 || b(14)) gl = true;
      if (ax > .35 || b(15)) gr = true;
      if (b(0)) gj = true;
      if (b(2) || b(1) || b(5)) ge = true;
      if (b(9)) gs = true;
    }
  } catch (e) { /* gamepad non disponibile */ }
  inp.left = !!(K('ArrowLeft') || K('KeyA') || touch.left || gl);
  inp.right = !!(K('ArrowRight') || K('KeyD') || touch.right || gr);
  const j = !!(K('Space') || K('ArrowUp') || K('KeyW') || K('KeyZ') || touch.jump || gj);
  const er = !!(K('KeyX') || K('ShiftLeft') || K('ShiftRight') || K('KeyK') || touch.erase || ge);
  const st = !!(K('Enter') || K('Space') || gj || gs);
  const pz = !!(K('KeyP') || K('Escape') || gs);
  for (const c in kd) delete kd[c];
  // i fronti restano "agganciati" finché un passo di simulazione non li consuma
  inp.jumpP = inp.jumpP || (j && !prevJ); inp.jump = j; prevJ = j;
  inp.eraseP = inp.eraseP || (er && !prevE); inp.erase = er; prevE = er;
  inp.startP = inp.startP || (st && !prevS); prevS = st;
  inp.pauseP = inp.pauseP || (pz && !prevPz); prevPz = pz;
}

/* ---------- audio procedurale ---------- */
const AU = {
  ctx: null, muted: false, next: 0, mood: 0, bar: 0, stepN: 0,
  unlock() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { } }
  },
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : .8; this.master.connect(c.destination);
      this.music = c.createGain(); this.music.gain.value = .55; this.music.connect(this.master);
      this.fx = c.createGain(); this.fx.gain.value = .8; this.fx.connect(this.master);
      // eco morbida per dare spazio
      const d = c.createDelay(1); d.delayTime.value = .37;
      const fb = c.createGain(); fb.gain.value = .34;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.music);
      this.echo = d;
      // riverbero: una stanza vuota generata dal rumore
      const rl = Math.floor(c.sampleRate * 3), ib = c.createBuffer(2, rl, c.sampleRate);
      for (let k = 0; k < 2; k++) { const dd = ib.getChannelData(k); for (let i = 0; i < rl; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.8); }
      this.rev = c.createConvolver(); this.rev.buffer = ib;
      const rg = c.createGain(); rg.gain.value = .55; this.rev.connect(rg); rg.connect(this.master);
      this.music.connect(this.rev);
      const fxs = c.createGain(); fxs.gain.value = .25; this.fx.connect(fxs); fxs.connect(this.rev);
      // rumore
      const nb = c.createBuffer(1, c.sampleRate * 1.5, c.sampleRate), ch = nb.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      this.nbuf = nb;
      // bordone
      this.dr = [];
      const dg = this.droneG = c.createGain(); dg.gain.value = 0;
      const dl = c.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 420;
      dg.connect(dl); dl.connect(this.music);
      [1, 1.5, 2.005, 2.4].forEach((m, i) => {
        const o = c.createOscillator(); o.type = i === 3 ? 'triangle' : 'sine';
        const g = c.createGain(); g.gain.value = [.5, .22, .16, 0][i];
        o.frequency.value = 73.42 * m; o.connect(g); g.connect(dg); o.start();
        this.dr.push({ o, g, m });
      });
      dg.gain.setTargetAtTime(.22, c.currentTime, 2);
      // pioggia (temporale del livello III)
      const rs = c.createBufferSource(); rs.buffer = nb; rs.loop = true;
      const rf = c.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 2400; rf.Q.value = .35;
      this.rainG = c.createGain(); this.rainG.gain.value = 0; rs.connect(rf); rf.connect(this.rainG); this.rainG.connect(this.master); rs.start();
      this.next = c.currentTime + .5;
    } catch (e) { this.ctx = null; }
  },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .8, this.ctx.currentTime, .05); },
  setMood(m) {
    this.mood = m; this.bar = 0; this.stepN = 0; this.rain(false);
    if (!this.ctx) return;
    const r = 440 * Math.pow(2, (MUSIC[m].root - 24 - 69) / 12), t = this.ctx.currentTime;
    this.dr.forEach(d => d.o.frequency.setTargetAtTime(r * d.m, t, 1.2));
    this.dr[3].g.gain.setTargetAtTime(m >= 2 ? .1 : 0, t, 1);
  },
  rain(on) { if (this.rainG) this.rainG.gain.setTargetAtTime(on ? .09 : 0, this.ctx.currentTime, .8); },
  // voci
  pad(f, dur, vol, when) {
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 1.004; lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + dur * .35); g.gain.linearRampToValueAtTime(vol * .7, when + dur * .8); g.gain.linearRampToValueAtTime(0, when + dur * 1.25);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.music); o.start(when); o2.start(when); o.stop(when + dur * 1.3); o2.stop(when + dur * 1.3);
  },
  piano(f, vol, when, dec) { this.tone(f, dec || 2.4, 'triangle', vol, this.echo, when); this.tone(f, (dec || 2.4) * .8, 'sine', vol * .8, this.music, when); this.tone(f * 2, 1.1, 'sine', vol * .25, this.music, when); },
  celesta(f, vol, when) { this.tone(f, 1.6, 'sine', vol, this.echo, when); this.tone(f, 1.3, 'sine', vol, this.music, when); this.tone(f * 3, .5, 'sine', vol * .22, this.music, when); },
  pluck(f, vol, when) { this.tone(f, .22, 'triangle', vol, this.music, when); this.tone(f * 2, .1, 'sine', vol * .3, this.echo, when); },
  tone(f, dur, type, vol, dest, when, slide) {
    if (!this.ctx) return;
    const c = this.ctx, t = (when || c.currentTime);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(dest || this.fx); o.start(t); o.stop(t + dur + .05);
    return g;
  },
  noise(dur, vol, type, f0, f1, q, when) {
    if (!this.ctx) return;
    const c = this.ctx, t = when || c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(this.fx); s.start(t, Math.random()); s.stop(t + dur + .05);
  },
  sfx(n) {
    if (!this.ctx) return;
    switch (n) {
      case 'jump': this.noise(.09, .13, 'bandpass', 2600, 4200, 3); this.tone(392, .12, 'sine', .09, null, null, 700); break;
      case 'jump2': this.noise(.11, .12, 'bandpass', 3400, 5400, 4); this.tone(587, .14, 'sine', .09, null, null, 1050); this.tone(1175, .2, 'sine', .03, this.echo); break;
      case 'land': this.noise(.07, .12, 'lowpass', 500, 180, 1); this.tone(140, .08, 'sine', .08, null, null, 70); break;
      case 'step': this.noise(.035, .05, 'bandpass', 1500 + Math.random() * 900, 700, 1.5); break;
      case 'drip': this.tone(1500 + Math.random() * 500, .12, 'sine', .035, this.echo, null, 700); break;
      case 'erase': this.noise(.42, .3, 'bandpass', 900, 5200, 1.5); this.tone(880, .3, 'sine', .07, null, null, 1760); break;
      case 'nope': this.tone(180, .08, 'square', .04); break;
      case 'die': this.tone(330, .5, 'sawtooth', .09, null, null, 60); this.noise(.5, .18, 'lowpass', 1400, 120, 1); break;
      case 'mark': this.tone(1318, .5, 'sine', .09, this.echo); this.tone(1976, .6, 'sine', .06, this.echo, this.ctx.currentTime + .08); break;
      case 'check': this.tone(587, .6, 'triangle', .08, this.echo); this.tone(880, .8, 'sine', .06, this.echo, this.ctx.currentTime + .12); break;
      case 'stomp': this.tone(660, .18, 'triangle', .1, null, null, 990); this.noise(.1, .12, 'bandpass', 1800, 900, 2); break;
      case 'page': this.noise(.55, .22, 'bandpass', 500, 3200, .8); break;
      case 'whisper': this.noise(.9, .07, 'bandpass', 1900, 1300, 6); this.noise(.7, .05, 'bandpass', 3100, 2400, 8, this.ctx.currentTime + .15); break;
      case 'candle': this.tone(784, .7, 'sine', .08, this.echo); this.noise(.3, .08, 'highpass', 4000, 6000, 1); break;
      case 'flip': this.tone(220, .35, 'sine', .1, null, null, 440); this.tone(440, .35, 'sine', .06, null, null, 220); break;
      case 'flee': this.tone(900, .12, 'triangle', .04, null, null, 1500); break;
      case 'hit': this.tone(110, .5, 'sawtooth', .14, null, null, 40); this.noise(.35, .25, 'lowpass', 2400, 200, 1); break;
      case 'shoot': this.tone(240, .25, 'square', .035, null, null, 120); break;
      case 'thunder': this.noise(1.6, .5, 'lowpass', 900, 60, .7); this.tone(48, 1.2, 'sine', .3, null, null, 30); break;
      case 'crack': this.noise(.12, .2, 'highpass', 5000, 7000, 2); this.tone(2400, .1, 'square', .03); this.noise(.1, .16, 'highpass', 4200, 6400, 2, this.ctx.currentTime + .22); break;
      case 'swim': this.noise(.16, .1, 'lowpass', 700, 250, 1); this.tone(300, .12, 'sine', .04, null, null, 520); break;
      case 'growl': this.tone(70, .7, 'sawtooth', .12, null, null, 48); this.noise(.6, .1, 'lowpass', 300, 120, 2); break;
      case 'whistle': this.tone(1480, 1, 'square', .05, null, null, 1380); this.tone(1976, 1, 'sine', .05, null, null, 1860); this.noise(1, .08, 'bandpass', 3000, 2600, 3); break;
      case 'win': [293.66, 440, 587.33, 880].forEach((f, i) => this.tone(f, 2.2, 'sine', .08, this.echo, this.ctx.currentTime + i * .22)); break;
    }
  },
  heart(strong) {
    if (!this.ctx) return;
    this.tone(strong ? 62 : 50, .22, 'sine', strong ? .55 : .38, this.fx, null, 34);
  },
  // partitura: progressione di accordi, arpeggio di pianoforte e il tema di Postilla
  tick() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const c = this.ctx, t = c.currentTime, M = MUSIC[this.mood];
    if (this.next < t - 1) this.next = t + .05;
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    while (this.next < t + .3) {
      const w = this.next, sN = this.stepN++, inBar = sN % 8;
      const prog = PROGS[M.prog], ch = CHORDS[prog[this.bar % prog.length]];
      if (inBar === 0) {
        const dur = M.st * 8;
        if (M.pad) for (const n of ch) this.pad(hz(M.root + n), dur, M.pad, w);
        this.tone(hz(M.root + ch[0] - 12), dur * 1.1, 'sine', M.bass, this.music, w);
      }
      if (M.walk) { const wn = [ch[0], ch[1], ch[2], ch[1] + (inBar % 3 ? 0 : 2)][inBar % 4] - 12; this.tone(hz(M.root + wn), M.st * 1.5, 'sine', .11, this.music, w); this.tone(hz(M.root + wn + 12), .12, 'triangle', .03, this.music, w); if (inBar % 2) this.noise(.05, .025, 'highpass', 7000, 9000, 1, w); }
      if (M.ost && inBar % 2 === 0) { const g = this.tone(hz(M.root + ch[0] - 12 + (inBar === 6 ? 7 : 0)), M.st * 1.6, 'sawtooth', M.ost, this.music, w); }
      // tema: sette note, ogni quattro battute
      const motifBar = this.bar % 4 === (M.motif || 0);
      if (M.motif !== undefined && motifBar && inBar < 7) { const mo = [7, 10, 12, 10, 15, 14, 12][inBar]; if (inBar !== 3 || true) this.celesta(hz(M.root + 12 + mo), .05, w); }
      else if (Math.random() < M.dens) {
        const tones = [ch[0], ch[1], ch[2], ch[0] + 12, ch[1] + 12];
        const n = M.style === 'pluck' ? tones[[0, 1, 2, 3, 2, 1, 4, 2][inBar]] : pick(tones);
        const f = hz(M.root + 12 + n + (M.sour && Math.random() < .12 ? 1 : 0));
        if (M.style === 'pluck') this.pluck(f, .07, w); else if (M.style === 'box') this.celesta(f * 2, .04, w); else this.piano(f, .045 + Math.random() * .02, w, M.dec);
      }
      if (inBar === 7) this.bar++;
      this.next += M.st * (M.style === 'pluck' || M.ost ? 1 : .92 + Math.random() * .16);
    }
  }
};
// accordi (semitoni dalla tonica) e progressioni
const CHORDS = { I: [0, 4, 7], IV: [5, 9, 12], Vm: [-5, -1, 2], vi: [-3, 0, 4], ii: [2, 5, 9], i: [0, 3, 7], VI: [-4, 0, 3], iv: [5, 8, 12], V: [-5, -1, 2], III: [3, 7, 10], VII: [-2, 2, 5], bII: [1, 5, 8] };
const PROGS = [['i', 'VI', 'iv', 'V'], ['i', 'iv', 'VII', 'III'], ['i', 'i', 'VI', 'V'], ['i', 'bII', 'i', 'V'], ['i', 'VII', 'VI', 'V'], ['I', 'vi', 'IV', 'Vm'], ['I', 'IV', 'I', 'Vm'], ['vi', 'IV', 'I', 'Vm'], ['I', 'ii', 'IV', 'Vm']];
// una voce diversa per ogni livello
const MUSIC = [
  { root: 50, st: .46, prog: 0, dens: .5, pad: .03, bass: .09, motif: 0 },                    // L'arrivo / biblioteca
  { root: 50, st: .42, prog: 1, dens: .6, pad: .028, bass: .09, motif: 2 },                   // Le stanze
  { root: 48, st: .56, prog: 3, dens: .28, pad: .034, bass: .1, sour: true, dec: 3 },         // Il diario mente
  { root: 53, st: .25, prog: 4, dens: .85, pad: .018, bass: .07, style: 'pluck' },            // Le righe fuggono
  { root: 45, st: .7, prog: 3, dens: .1, pad: .045, bass: .13, sour: true, dec: 3.4 },        // Sotto il pavimento
  { root: 49, st: .44, prog: 4, dens: .55, pad: .03, bass: .09, motif: 1 },                   // A ritroso
  { root: 47, st: .27, prog: 2, dens: .7, pad: .02, bass: .08, ost: .028 },                   // Tra le lettere
  { root: 48, st: .5, prog: 1, dens: .45, pad: .034, bass: .09, motif: 3, dec: 3 },           // Lo specchio
  { root: 44, st: .23, prog: 3, dens: .8, pad: .03, bass: .11, ost: .04, sour: true, dec: 1.2 }, // La pagina
  // libro secondo: carillon, pizzicati, tonalità maggiori
  { root: 60, st: .3, prog: 5, dens: .7, pad: .02, bass: .07, style: 'box', motif: 0 },          // C'era una volta
  { root: 62, st: .27, prog: 6, dens: .8, pad: .018, bass: .07, style: 'pluck', sour: true },    // Parole scambiate
  { root: 57, st: .5, prog: 7, dens: .22, pad: .03, bass: .09, style: 'box', dec: 2 },           // Un, due, tre, lupo
  { root: 65, st: .26, prog: 8, dens: .75, pad: .02, bass: .07, style: 'box', motif: 2 },        // Giorno e notte
  { root: 58, st: .4, prog: 7, dens: .45, pad: .04, bass: .08, style: 'box', dec: 3 },           // Il bosco allagato
  { root: 64, st: .3, prog: 5, dens: .7, pad: .02, bass: .07, style: 'pluck', motif: 1 },        // Le rime
  { root: 55, st: .48, prog: 7, dens: .35, pad: .034, bass: .09, style: 'box', motif: 3 },       // La lanterna
  { root: 52, st: .22, prog: 6, dens: .85, pad: .025, bass: .1, ost: .03, style: 'pluck', sour: true }, // Il Narratore

/* ---------- particelle ---------- */
const parts = [];
function puff(x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    if (parts.length > 700) parts.shift();
    const a = o.ang !== undefined ? o.ang + rnd(-(o.spread || .5), o.spread || .5) : rnd(TAU);
    const sp = rnd(o.s0 || 20, o.s1 || 120);
    parts.push({
      x: x + rnd(-(o.jx || 0), o.jx || 0), y: y + rnd(-(o.jy || 0), o.jy || 0),
      vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
      life: 0, max: rnd(o.l0 || .3, o.l1 || .8), size: rnd(o.z0 || 1.5, o.z1 || 4),
      col: o.col || INK, grav: o.grav === undefined ? 500 : o.grav, drag: o.drag || 0, glow: o.glow || 0
    });
  }
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts() {
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    ctx.globalAlpha = Math.min(1, k * 1.6);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + .6 * k), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- forme d'inchiostro ---------- */
function blobPath(cx, cy, rx, ry, t, seed, wob) {
  const n = 12; ctx.beginPath();
  let px = [], py = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const k = 1 + wob * (Math.sin(a * 3 + t * 1.7 + seed) * .5 + Math.sin(a * 5 - t * 1.1 + seed * 2.3) * .3 + Math.sin(a * 2 + t * .6 + seed * .7) * .4);
    px.push(cx + Math.cos(a) * rx * k); py.push(cy + Math.sin(a) * ry * k);
  }
  ctx.moveTo((px[0] + px[n - 1]) / 2, (py[0] + py[n - 1]) / 2);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    ctx.quadraticCurveTo(px[i], py[i], (px[i] + px[j]) / 2, (py[i] + py[j]) / 2);
  }
  ctx.closePath();
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* grana di carta e vignettatura (pre-renderizzate) */
let GRAIN = null, VIGN = null, DARKC = null, DARKX = null;
function buildTextures() {
  GRAIN = mkCanvas(256, 256);
  const g = GRAIN.getContext('2d'), r = rng(7);
  for (let i = 0; i < 5200; i++) {
    const v = r();
    g.fillStyle = v > .4 ? 'rgba(60,40,20,' + (.025 + r() * .05) + ')' : 'rgba(255,250,235,' + (.015 + r() * .03) + ')';
    g.fillRect(r() * 256, r() * 256, 1 + r() * 2.2, 1 + r() * 1.4);
  }
  for (let i = 0; i < 26; i++) { // fibre
    g.strokeStyle = 'rgba(90,60,30,' + (.03 + r() * .04) + ')'; g.lineWidth = .6;
    const x = r() * 256, y = r() * 256; g.beginPath(); g.moveTo(x, y); g.lineTo(x + r() * 30 - 15, y + r() * 12 - 6); g.stroke();
  }
  VIGN = mkCanvas(480, 270);
  const v = VIGN.getContext('2d');
  const gr = v.createRadialGradient(240, 135, 90, 240, 135, 300);
  gr.addColorStop(0, 'rgba(40,22,8,0)'); gr.addColorStop(.7, 'rgba(40,22,8,.16)'); gr.addColorStop(1, 'rgba(22,10,4,.55)');
  v.fillStyle = gr; v.fillRect(0, 0, 480, 270);
  DARKC = mkCanvas(480, 270); DARKX = DARKC.getContext('2d');
}

function mkLevel(o) {
  return Object.assign({ plats: [], blocks: [], stains: [], bugs: [], marks: [], candles: [], checks: [], hints: [], zones: [], spawn: { x: 100, y: 300 }, exit: null }, o);
}
function builder(L, x, y, dir) {
  dir = dir || 1;
  let zx = null;
  const mk = (text, gap, dy, o) => {
    o = o || {};
    const w = o.w || Math.round(text.length * 9.2 + 14);
    let nx, ny;
    if (!b.last) { nx = dir > 0 ? b.cx : b.cx - w; ny = b.cy; }
    else { ny = b.last.y + (dy || 0); nx = dir > 0 ? b.last.x0 + b.last.w + (gap || 0) : b.last.x0 - (gap || 0) - w; }
    const p = Object.assign({ kind: 'line', layer: 0 }, o, { x: nx, y: ny, x0: nx, w, h: LH, text, dirn: dir });
    L.plats.push(p); return p;
  };
  const b = {
    last: null, cx: x, cy: y,
    ln(text, gap, dy, o) { b.last = mk(text, gap, dy, o); return b; },
    side(text, gap, dy, o) { mk(text, gap, dy, o); return b; },
    spawn() { const p = b.last; L.spawn = { x: dir > 0 ? p.x + 36 : p.x + p.w - 56, y: p.y - 30 }; return b; },
    mark(fx, up) { const p = b.last; L.marks.push({ x: p.x + p.w * (fx === undefined ? .5 : fx), y: p.y - (up === undefined ? 48 : up) }); return b; },
    check(inv) { const p = b.last; L.checks.push({ x: p.x + p.w / 2, y: inv ? p.y + LH : p.y, inv: !!inv }); return b; },
    bug(bad, good, sp) { const p = b.last; const w = bad.length * 9.6 + 10; L.bugs.push({ x: p.x + p.w * .5, y: p.y - 22, w, h: 22, minX: p.x + 4, maxX: p.x + p.w - 4, vx: sp || 55, bad, good }); return b; },
    stain(fx, w, layer, beat) { const p = b.last; const s = { x: p.x + p.w * fx - w / 2, y: p.y - 13, w, h: 18, layer: layer || 0 }; if (beat !== undefined) s.beat = beat; L.stains.push(s); return b; },
    storm() { L.storm = b.last.x; return b; },
    auto() { L.auto = b.last.x; return b; },
    wall(text, fx, layer) { const p = b.last; L.blocks.push({ x: p.x + p.w * (fx === undefined ? .6 : fx) - 23, y: p.y - 300, w: 46, h: 300, text, corrupt: true, off: 0, layer: layer || 0 }); return b; },
    candle(fx) { const p = b.last; L.candles.push({ x: p.x + p.w * (fx === undefined ? .5 : fx), y: p.y - 30, cd: 0 }); return b; },
    hint(k, dx, dy) { const p = b.last; L.hints.push({ x: p.x + (dx === undefined ? p.w / 2 : dx), y: p.y + (dy === undefined ? -84 : dy), k }); return b; },
    say(t) { b.last.say = t; return b; },
    exit() { const p = b.last; L.exit = { x: dir > 0 ? p.x + p.w - 54 : p.x + 14, y: p.y - 74, w: 40, h: 74 }; return b; },
    zoneStart() { zx = b.last.x - 40; return b; },
    zoneEnd() { const x0 = b.last.x + 8; L.zones.push({ x: x0, y: -99999, w: zx - x0, h: 199998 }); return b; }
  };
  return b;
}

function lv7() {
  const L = mkLevel({ name: 'Tra le lettere', date: '—', theme: 'letters', mood: 6, chase: true });
  const top = 220;
  const first = { kind: 'line', layer: 0, x: 120, x0: 120, y: 262, w: 440, h: LH, text: 'Mi faccio piccolo. Mi nascondo tra le lettere,', say: 'Dove lui non guarda. Ma la cancellatura non legge: cancella.' };
  L.plats.push(first); L.spawn = { x: 160, y: 232 };
  const words = 'lui non ha ombra e non ha nome ma io ho un nome e lui me lo ruba'.split(' ');
  const MK = { '0,2': 1, '3,2': 1, '4,0': 1, '8,1': 1, '12,2': 1, '17,2': 1 };
  let x = 626;
  words.forEach((wd, wi) => {
    [...wd].forEach((ch, ci) => {
      const g = GLY[ch]; let gw = 0;
      g.forEach(r => gw = Math.max(gw, r.length));
      g.forEach((row, r) => {
        let c = 0;
        while (c < row.length) {
          if (row[c] === '#') { let c1 = c; while (c1 < row.length && row[c1] === '#') c1++; L.blocks.push({ x: x + c * TILE, y: top + r * TILE, w: (c1 - c) * TILE, h: TILE, tile: true }); c = c1; }
          else c++;
        }
      });
      const colTop = col => { for (let r = 0; r < 7; r++) if (g[r][col] === '#') return top + r * TILE; return top + 7 * TILE; };
      if (ci === 0 && wd.length > 1 && (wi % 2 === 1 || wi === 14)) L.checks.push({ x: x + TILE * 1.5, y: colTop(1), inv: false });
      if (wi === 8 && ci === 0) L.fast = x;
      if (MK[wi + ',' + ci]) L.marks.push({ x: x + TILE, y: colTop(0) - 50 });
      x += (gw + 1) * TILE;
    });
    x += TILE;
  });
  const end = { kind: 'line', layer: 0, x: x - 30, x0: x - 30, y: 330, w: 420, h: LH, text: 'Trattengo il respiro. È passata oltre.' };
  L.plats.push(end); L.exit = { x: end.x + end.w - 54, y: end.y - 74, w: 40, h: 74 };
  return L;
}

function fbuilder(L, x, y) {
  const b = builder(L, x, y, 1); let wx = null;
  L.words = L.words || []; L.wolves = L.wolves || []; L.npcs = L.npcs || [];
  b.word = (k, fx) => { const p = b.last; L.words.push({ x: p.x + p.w * (fx === undefined ? .5 : fx), y: p.y - 44, k, cd: 0 }); return b; };
  b.sw = (bad, good, gap, dy) => b.ln(bad, gap, dy, { kind: 'swap', good, w: Math.max(110, Math.round(good.length * 9.2 + 30)) });
  b.rh = (text, key, gap, dy, reveals) => b.ln(text, gap, dy, { kind: 'rhyme', key, reveals });
  b.rev = (key) => { b.last.reveals = key; return b; };
  b.rovi = (fx) => { const p = b.last; L.blocks.push({ x: p.x + p.w * fx - 20, y: p.y - 300, w: 40, h: 300, twig: true, off: 0 }); return b; };
  b.npc = (fx, text) => { const p = b.last; L.npcs.push({ x: p.x + p.w * (fx === undefined ? .7 : fx), y: p.y, text, seen: false, a: 1 }); return b; };
  b.wolfStart = () => { wx = b.last.x + b.last.w + 10; return b; };
  b.wolfEnd = () => { const p = b.last; L.wolves.push({ x0: wx, x1: p.x + p.w + 10, y: p.y, t: 0 }); return b; };
  return b;
}

function nbuilder(L, x, y) {
  const b = fbuilder(L, x, y);
  L.shades = L.shades || []; L.beams = L.beams || [];
  b.sway = (text, gap, dy, amp, sp, ph) => b.ln(text, gap, dy, { kind: 'sway', amp: amp || 50, sp: sp || 1.5, ph: ph || 0, w: Math.max(120, Math.round(text.length * 9.2 + 30)) });
  b.om = (good, gap, dy) => b.ln('█'.repeat(Math.max(5, good.length - 2)), gap, dy, { kind: 'swap', good, omissis: true, w: Math.max(120, Math.round(good.length * 9.2 + 30)) });
  b.shade = (fx, w) => { const p = b.last; L.shades.push({ x: p.x + p.w * fx - w / 2, w, y: p.y }); return b; };
  b.beam = (fa, fb, sp, ph) => { const p = b.last; L.beams.push({ x0: p.x + p.w * fa, x1: p.x + p.w * fb, sp: sp || 1.1, ph: ph || 0, w: 110, y: p.y }); return b; };
  // interrogatorio: tre versioni, una sola regge. pos = -1 sopra, 0 in mezzo, 1 sotto
  b.tri = (truth, lies, pos) => {
    const offs = [-72, 0, 72], ty = offs[pos + 1], rest = offs.filter(o => o !== ty);
    b.side(lies[0], 120, rest[0], { kind: 'fake' }); b.side(lies[1], 120, rest[1], { kind: 'fake' });
    return b.ln(truth, 120, ty);
  };
  return b;
}

function mbuilder(L, x, y) {
  const b = nbuilder(L, x, y); let lx = null;
  L.pa = []; L.pb = []; L.stamps = []; L.lows = [];
  b.pa = (id, fx, two, stars, up) => { const p = b.last; L.pa.push({ id, x: p.x + p.w * fx, y: p.y - (up || 26), two: !!two, stars: stars || 1, plat: p }); return b; };
  b.pb = (id, fx) => { const p = b.last; L.pb.push({ id, x: p.x + p.w * fx, y: p.y - 26, plat: p }); return b; };
  b.stamp = (fx) => { const p = b.last; L.stamps.push({ x: p.x + p.w * (fx === undefined ? .5 : fx), y: p.y - 34, got: false }); return b; };
  b.gate = (fx) => { const p = b.last; L.blocks.push({ x: p.x + p.w * fx - 23, y: p.y - 300, w: 46, h: 300, gate: true, off: 0 }); return b; };
  b.door = (fx, per, ph) => { const p = b.last; L.blocks.push({ x: p.x + p.w * fx - 20, y: p.y - 300, w: 40, h: 300, door: true, per: per || 3, ph: ph || 0, off: 0 }); return b; };
  b.lowStart = () => { lx = b.last.x + b.last.w - 30; return b; };
  b.lowEnd = () => { L.lows.push({ x: lx, w: b.last.x + 40 - lx }); return b; };
  b.coin = (text, gap, dy, ci) => b.ln(text, gap, dy, { kind: 'coin', ci, orig: text, w: 150 });
  return b;
}

      for (let i = 1; i <= 24 * k; i++) { const u = i / 24; ctx.lineTo(X - 16 + u * 34, Y + 4 - Math.sin(u * TAU) * 9 * (u < .5 ? 1.3 : .9) - u * 6); } ctx.stroke();

    if (t > 2.5) { ctx.textAlign = 'center'; ctx.globalAlpha = .45 + Math.sin(t * 3) * .2; ctx.font = F_HAND; ctx.fillStyle = GRAPHITE; ctx.fillText(IS_TOUCH ? 'tocca per voltare pagina' : 'SPAZIO per voltare pagina', W / 2, 500); ctx.globalAlpha = 1; }
  } else {
    const epi = !!CHAPTERS[G.chapter].epi, last = epi || G.chapter === NB - 1;
    drawShelf(last ? clamp((t - 1.5) / 6, 0, 1) : 0);
    ctx.textAlign = 'center';
    fadeText(C.shelf[0], W / 2, 120, t, .5, 'italic 25px ' + SERIF, '#f1e6cc');
    fadeText(C.shelf[1], W / 2, 164, t, 3, 'italic 23px ' + SERIF, '#f1e6cc');
    const s = G.stats;
    fadeText(s.points + ' punti', W / 2, 240, t, 4.5, '500 40px ' + SERIF, '#ffe9b0');
    fadeText('tempo ' + mmss(s.time) + '   ·   annotazioni ' + s.marks + '/' + s.total + '   ·   parole corrette ' + s.fixed + '   ·   cadute ' + s.deaths, W / 2, 274, t, 4.5, F_HAND, 'rgba(241,230,204,.75)');
    if (s.full && s.marks >= s.total) fadeText(C.secret, W / 2, 322, t, 5.5, 'italic 500 24px ' + SERIF, '#ffe9b0');
    else fadeText('Il lettore ha lasciato altre note a margine. Non le hai trovate tutte.', W / 2, 322, t, 5.5, F_HAND, 'rgba(241,230,204,.6)');
    if (!last) fadeText('Sullo scaffale, un altro libro si è aperto.', W / 2, 362, t, 6, F_HAND, '#ffe9b0');
    else if (!epi) fadeText('In fondo alla biblioteca si è accesa una lampada. L\'epilogo ti aspetta.', W / 2, 362, t, 6, F_HAND, '#ffe9b0');
    else fadeText('Grazie per aver letto Marginalia.', W / 2, 362, t, 6, 'italic 22px ' + SERIF, '#ffe9b0');
    if (t > 5.5) button(W / 2 - 130, 400, 260, 46, 'Torna alla biblioteca', () => { if (!last) G.chapter++; toTitle(); }, true);
  }
  ctx.textAlign = 'left';
}
function updEnding(dt) {
  const E = G.end, pages = CHAPTERS[G.chapter].ending; E.t += dt;
  if (G.turn) return;
  if (hitButtons()) return;
  const skip = (inp.startP || uiTap) && E.t > 1.2;
  if (E.page < pages.length && (E.t > pages[E.page].dur || skip)) { uiTap = null; E.page++; E.t = 0; AU.sfx('page'); }
}

/* ---------------- ciclo principale ---------------- */
const STEP = 1 / 120;
let lastTs = 0, acc = 0, GPAT = null;
function step(dt) {
  if (G.turn) {
    const T = G.turn; T.t += dt;
    if (!T.mid && T.t >= T.dur / 2) { T.mid = true; T.fn(); }
    if (T.t >= T.dur) G.turn = null;
    if (G.state !== 'play') G.t += dt;
    return;
  }
  if (keys.KeyM && !step.m) { AU.setMute(!AU.muted); syncMute(); } step.m = keys.KeyM;
  if (G.state === 'title') { G.t += dt; updTitle(); }
  else if (G.state === 'intro') { G.t += dt; updIntro(dt); }
  else if (G.state === 'ending') { G.t += dt; updEnding(dt); }
  else if (G.state === 'play') {
    if (inp.pauseP) G.paused = !G.paused;
    if (G.paused) { hitButtons(); return; }
    update(dt);
  }
}
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (G.state === 'title') drawTitle();
  else if (G.state === 'intro') drawIntro();
  else if (G.state === 'ending') drawEnding();
  else drawWorld();
  if (!GPAT) GPAT = ctx.createPattern(GRAIN, 'repeat');
  if (GPAT) { ctx.fillStyle = GPAT; ctx.fillRect(0, 0, W, H); }
  if (G.state === 'play') { ctx.drawImage(VIGN, 0, 0, W, H); drawHUD(); }
  drawTurn();
}
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000; let d = Math.min(.1, now - lastTs); lastTs = now; if (!(d > 0)) d = 0;
  pollInput(); AU.tick();
  acc += d; let n = 0;
  while (acc >= STEP && n < 14) { step(STEP); acc -= STEP; n++; inp.jumpP = inp.eraseP = inp.startP = inp.pauseP = false; uiTap = null; }
  if (acc > STEP * 14) acc = 0;
  draw();
}
function syncMute() { const b = document.getElementById('bMute'); if (b) b.classList.toggle('off', AU.muted); }
function boot() {
  loadSave(); buildTextures(); fit(); bindPad();
  for (let c = NB - 1; c >= 0; c--) if (unlocked(c) && !SAVE.books[c].done) SEL = c;
  HOP.from = HOP.to = SEL;
  if (!SAVE.pro) { startIntro(PROLOGUE, 'lib', () => { SAVE.pro = true; writeSave(); startTurn(() => { G.state = 'title'; }); }); }
  const bm = document.getElementById('bMute'), bp = document.getElementById('bPause'), bf = document.getElementById('bFull');
  bm.addEventListener('click', () => { AU.unlock(); AU.setMute(!AU.muted); syncMute(); bm.blur(); });
  bp.addEventListener('click', () => { AU.unlock(); if (G.state === 'play' && !G.turn) G.paused = !G.paused; bp.blur(); });
  const el = document.documentElement;
  if (!el.requestFullscreen) bf.style.display = 'none';
  bf.addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else { const p = el.requestFullscreen(); if (p && p.catch) p.catch(() => { }); } } catch (e) { } bf.blur(); });
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) enableTouch();
  requestAnimationFrame(frame);
}
let booted = false;
function bootOnce() { if (booted) return; booted = true; boot(); }
try {
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('italic 500 24px "EB Garamond"'), document.fonts.load('500 24px "EB Garamond"')]).then(bootOnce, bootOnce);
    setTimeout(bootOnce, 1500);
  } else bootOnce();
} catch (e) { bootOnce(); }

</script>
